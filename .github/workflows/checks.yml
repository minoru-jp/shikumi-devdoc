name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and typing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint,typecheck]"

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Ruff lint
        run: ruff check .

      - name: Run BasedPyright
        run: basedpyright

      - name: Check consumer typing contract
        run: basedpyright -p tests/typing

      - name: Check documented mypy override recipe
        run: python scripts/check_mypy_recipe.py

  canonical-docs:
    name: Check canonical documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check canonical documents
        run: python scripts/render_canonical_docs.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  minimum-shikumi:
    name: Test minimum Shikumi (0.2.0)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install minimum supported Shikumi and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "shikumi==0.2.0"

      - name: Run tests
        run: python -m pytest
